<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#103765"><title>APAC Visitor Check-In — Demo</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#103765;color:white;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}header strong{letter-spacing:.07em}.demo{background:#fff1c9;color:#5b4300;border-radius:30px;padding:6px 12px;font-weight:750}main{max-width:650px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #e1e8ef;border-radius:20px;box-shadow:0 15px 45px #22395713;padding:30px;min-height:500px}img.logo{display:block;max-width:min(100%,340px);max-height:125px;object-fit:contain;margin:3px auto 16px}h1{color:#103765;text-align:center;font-size:clamp(24px,5vw,32px);margin:12px 0}p.sub{text-align:center;line-height:1.5;color:#526277}h2{color:#103765;font-size:20px}button{font:inherit;cursor:pointer}.btn{width:100%;border:0;border-radius:12px;padding:16px;margin:8px 0;font-size:17px;font-weight:750;background:#103765;color:white}.btn.secondary{background:#edf3f8;color:#103765}.btn.green{background:#269747}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb900;outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .btn{margin:0;min-height:84px}label{display:block;font-weight:650;font-size:14px;margin:17px 0 6px}input,select{width:100%;padding:13px;border:1px solid #bfcbd9;border-radius:10px;font:inherit;background:white;color:#17283b}.check{display:flex;align-items:center;gap:10px;padding:12px;background:#f2f5f9;border-radius:10px;margin:15px 0}.check input{width:20px;height:20px;margin:0}.check label{margin:0}.meta{text-align:center;font-size:14px;color:#667a8c;margin-bottom:18px}.row{padding:14px;border:1px solid #dbe3ec;border-radius:10px;margin:10px 0}.row strong{display:block;color:#103765}.row small{display:block;color:#617083;margin:5px 0}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:9px;padding:10px;color:white;background:#103765}.tiny{color:#667;line-height:1.5;font-size:12px;text-align:center;margin-top:16px}.toast{background:#e8f7ec;color:#175923;padding:14px;border-radius:10px;margin-top:16px}.footer{max-width:650px;margin:12px auto 30px;padding:0 22px;display:flex;justify-content:space-between;align-items:center;color:#6b7d8e;font-size:12px}.link{background:none;border:none;color:#103765;text-decoration:underline;padding:8px}#appt-fields{display:none}@media(max-width:480px){.panel{padding:19px;min-height:440px}.grid{grid-template-columns:1fr 1fr}.grid .btn{font-size:15px;padding:10px}}
</style></head><body><header><strong>APAC PAPER &amp; PACKAGING</strong><span class="demo">DEMO — SAMPLE DATA ONLY</span></header><main><section class="panel"><img class="logo" src="apac_logo.png" alt="APAC Paper and Packaging logo"><div id="app" aria-live="polite"></div></section></main><div class="footer"><span id="clock"></span><button class="link" onclick="go('admin')">Demo administration</button></div>
<script>
'use strict';
const app=document.getElementById('app');const records=[];let view='home',kind='Visitor',idleTimer=0,lastActive=Date.now();let seq=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=stamp=>new Date(stamp).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('en-US',{dateStyle:'full',timeStyle:'short'});}clock();setInterval(clock,1000);
function resetIdle(){lastActive=Date.now();clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(Date.now()-lastActive>=60000)go('home');},60000)}
['click','keydown','touchstart','input','change'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));resetIdle();
function go(page){view=page;resetIdle();window.scrollTo({top:0,behavior:'instant'});render()}
function back(){go('home')}
function title(s,sub=''){return `<h1>${s}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}
function btn(s,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${s}</button>`}
function render(){if(view==='home'){app.innerHTML=title('Visitor Check-In','Welcome to APAC. Please sign in when you arrive and sign out before leaving.')+`<div class="meta" id="now"></div>`+btn('SIGN IN',"go('category')",'green')+btn('SIGN OUT',"go('signout')",'secondary')+`<p class="tiny">This is an interactive demonstration. Entries exist only in this open browser page and are not transmitted or saved to a server.</p>`;}
else if(view==='category'){app.innerHTML=title('Select Visitor Type')+`<div class="grid">`+['Visitor','Contractor','Vendor','Delivery Driver'].map(s=>`<button class="btn" onclick="choose('${s}')">${s}</button>`).join('')+`</div>`+btn('Back to Welcome',"go('home')",'secondary');}
else if(view==='signin'){app.innerHTML=title(esc(kind)+' Sign-In','Please complete all required fields.')+`<form id="visit-form"><label for="visitor">Full Name *</label><input id="visitor" required maxlength="100" autocomplete="name"><label for="company">Company / Organization *</label><input id="company" required maxlength="100"><label for="host">APAC Host / Department *</label><input id="host" required maxlength="100"><label for="reason">Reason for Visit *</label><input id="reason" required maxlength="200"><div class="check"><input id="has-appt" type="checkbox" onchange="toggleAppt()"><label for="has-appt">I have a scheduled appointment</label></div><div id="appt-fields"><label for="appt-date">Appointment Date *</label><input id="appt-date" type="date"><label for="appt-time">Appointment Time *</label><input id="appt-time" type="time"></div><button class="btn green" type="submit">COMPLETE SIGN-IN</button></form>`+btn('Cancel',"go('home')",'secondary');document.getElementById('visit-form').addEventListener('submit',save);}
else if(view==='complete'){app.innerHTML=title('Sign-In Complete','Thank you. Your arrival has been recorded in this demo session. Please sign out before leaving.')+`<div class="toast">✓ Demo sign-in successful.</div>`+btn('Back to Welcome',"go('home')");}
else if(view==='signedout'){app.innerHTML=title('You’re Signed Out','Thank you for visiting APAC.')+btn('Back to Welcome',"go('home')");}
else if(view==='signout'){let here=records.filter(x=>!x.out);app.innerHTML=title('Sign Out','Select your name to record your departure.')+(here.length?here.map(v=>`<div class="row"><strong>${esc(v.name)}</strong><small>${esc(v.company)} · Arrived ${fmt(v.arrival)}</small><div class="actions"><button onclick="signout(${v.id})">Confirm Sign-Out</button></div></div>`).join(''):`<p class="sub">Nobody is currently signed in during this demo session.</p>`)+btn('Back to Welcome',"go('home')",'secondary');}
else if(view==='admin'){app.innerHTML=title('Staff Administration','Demonstration dashboard — no production visitor data.')+`<div class="grid"><button class="btn" onclick="go('onsite')">Currently On-Site</button><button class="btn" onclick="go('history')">Visit History</button></div>`+btn('Export Demo Records (CSV)', 'csvExport()','secondary')+btn('Back to Welcome',"go('home')",'secondary')+`<p class="tiny">Administrator access is intentionally open in this demo. Do not use this static website for production visitor records.</p>`;}
else if(view==='onsite'||view==='history'){let list=view==='onsite'?records.filter(x=>!x.out):records;app.innerHTML=title(view==='onsite'?'Currently On-Site':'Visit History',`${list.length} demo record(s)`)+(list.length?list.slice().reverse().map(v=>`<div class="row"><strong>${esc(v.name)} — ${esc(v.category)}</strong><small>Organization: ${esc(v.company)}</small><small>Host: ${esc(v.host)} · Reason: ${esc(v.purpose)}</small>${v.appointment?`<small>Appointment: ${esc(v.appointment)}</small>`:''}<small>In: ${fmt(v.arrival)} · Out: ${v.out?fmt(v.out):'ON-SITE'}</small></div>`).join(''):`<p class="sub">No records in this browser session.</p>`)+btn('Back to Administration',"go('admin')",'secondary');}
const now=document.getElementById('now');if(now)now.textContent=new Date().toLocaleString('en-US',{dateStyle:'full',timeStyle:'short'});
}
function choose(s){kind=s;go('signin')}
function toggleAppt(){let yes=document.getElementById('has-appt').checked;document.getElementById('appt-fields').style.display=yes?'block':'none';for(let id of ['appt-date','appt-time'])document.getElementById(id).required=yes;}
function save(e){e.preventDefault();let val=id=>document.getElementById(id).value.trim();let a=document.getElementById('has-appt').checked;records.push({id:seq++,category:kind,name:val('visitor'),company:val('company'),host:val('host'),purpose:val('reason'),appointment:a?`${val('appt-date')} ${val('appt-time')}`:'',arrival:Date.now(),out:null});go('complete')}
function signout(id){let v=records.find(x=>x.id===id);if(v&&confirm(`Confirm sign-out for ${v.name}?`)){v.out=Date.now();go('signedout')}}
function csvExport(){let cols=['Category','Name','Company','Host','Purpose','Appointment','Sign In','Sign Out'];let quote=x=>'"'+String(x??'').replace(/\"/g,'""')+'"';let lines=[cols, ...records.map(x=>[x.category,x.name,x.company,x.host,x.purpose,x.appointment,fmt(x.arrival),x.out?fmt(x.out):''])];let blob=new Blob([lines.map(row=>row.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='APAC_demo_visitor_log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
render();setInterval(()=>{let now=document.getElementById('now');if(now)now.textContent=new Date().toLocaleString('en-US',{dateStyle:'full',timeStyle:'short'})},1000);
</script></body></html>
